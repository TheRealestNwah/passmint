name: Release

# Run this by hand from the Actions tab (target branch "main") to tag the
# current manifest.json version, then test, build and submit it to AMO's
# listed channel. Pick "unlisted" to sign on that channel instead. Pushing a
# matching v1.2.3 tag yourself also works and skips straight to the build.
#
# Needs two repository secrets from https://addons.mozilla.org/developers/addon/api/key/
#   AMO_JWT_ISSUER  the "JWT issuer" value
#   AMO_JWT_SECRET  the "JWT secret" value

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: AMO channel to sign on
        type: choice
        options: [listed, unlisted]
        default: listed

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    name: Build and sign for AMO
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CHANNEL: ${{ inputs.channel || 'listed' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check manifest and package versions match
        run: npm run check-versions

      - name: Determine release tag
        id: release
        run: echo "tag=v$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      # Running from a tag push, the tag already names the version being
      # released; running by hand from a branch, nothing points at a version
      # yet, so this job tags manifest.json's current version itself below.
      - name: Check the pushed tag matches the version
        if: github.ref_type == 'tag'
        run: |
          if [ "${{ github.ref_name }}" != "${{ steps.release.outputs.tag }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} doesn't match manifest.json's version (expected ${{ steps.release.outputs.tag }})."
            exit 1
          fi

      - name: Tag this commit
        if: github.ref_type != 'tag'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists on GitHub. Bump the version in manifest.json and package.json first."
            exit 1
          fi
          git tag -a "$TAG" -m "Passmint $TAG"
          git push origin "$TAG"

      - run: npm install

      - name: Unit tests
        run: npm test

      - name: Install Chromium for the popup tests
        run: npx playwright install --with-deps chromium

      - name: Popup tests (headless Chromium)
        run: npm run test:popup

      - name: web-ext lint
        run: npm run lint

      - name: Check AMO credentials are set
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::Add the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets before releasing."
            exit 1
          fi

      # Listed versions can sit in AMO's review queue, so don't wait for them;
      # AMO publishes and hosts the signed file once approved. Unlisted
      # signing is automated, so wait and keep the signed .xpi.
      - name: Sign on the ${{ env.CHANNEL }} channel
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ "$CHANNEL" = "listed" ]; then
            npm run sign -- --channel=listed --approval-timeout=0
          else
            npm run sign -- --channel=unlisted
          fi

      - uses: actions/upload-artifact@v4
        if: env.CHANNEL == 'unlisted'
        with:
          name: passmint-${{ steps.release.outputs.tag }}-signed
          path: web-ext-artifacts/*.xpi
          if-no-files-found: error
